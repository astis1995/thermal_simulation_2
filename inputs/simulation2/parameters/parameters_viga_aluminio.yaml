# ----------------------------------------------------
# Simulacion viga aluminio
# ----------------------------------------------------
domain:
  path: stl/barra_aluminio.stl
  unit: mm

  mesh:
    output_dir: mesh

    # Element size (mm)
    lc_min: 0.5
    lc_max: 1.0

  material:
    # Aluminum
    k: 237
    rho: 2699.0
    c: 900.0


simulation:

  geometry:
    representation: volume

  time:
    dt: 0.2
    T: 600.0

  # ----------------------------------------------------
  # Initial condition
  # ----------------------------------------------------

  initial_condition:
    type: uniform
    ambient: 298.15


  # ----------------------------------------------------
  # Physics
  # ----------------------------------------------------

  physics:

    fixed_heat:
      enabled: true
      power: 10.0

      region:
        type: box

        # Heat source is now INSIDE the beam.
        # Beam X range:
        # -0.11139 m -> +0.11139 m
        #
        # 30 mm heat region:
        # -0.11139 -> -0.08139 m
        center: [-0.09639, 0.0, 0.0]

        length_x: 0.030
        length_y: 0.030
        length_z: 0.030

      t_start: 0.0
      t_end: 600.0


    fixed_temperature:
      enabled: false

      temperature: 350.0

      region:
        type: box

        center: [0.0, 0.0, 0.005]

        length_x: 0.010
        length_y: 0.005
        length_z: 0.002


    convection:
      enabled: true
      h: 10.0
      ambient: 298.15


    radiation:
      enabled: true
      emissivity: 0.01
      ambient: 298.15


# ----------------------------------------------------
# ROI
# ----------------------------------------------------

roi:

  search:
    mode: nearest
    tolerance: 0.0003

  points:

    # ------------------------------------------------
    # TOP SURFACE — DIRECTLY IRRADIATED
    # ------------------------------------------------

    - name: Top_Center
      location: [0.0, 0.0, 0.01285]
      variables:
        - temperature

    - name: Top_NearCenter_Y
      location: [0.0, 0.005, 0.01285]
      variables:
        - temperature

    - name: Top_NearCenter_X
      location: [0.020, 0.0, 0.01285]
      variables:
        - temperature


    # ------------------------------------------------
    # THROUGH-THICKNESS
    # ------------------------------------------------

    - name: Center_Midplane
      location: [0.0, 0.0, 0.0]
      variables:
        - temperature

    - name: Bottom_Center
      location: [0.0, 0.0, -0.01285]
      variables:
        - temperature


    # ------------------------------------------------
    # LATERAL HEAT CONDUCTION
    # ------------------------------------------------

    - name: Side_Near
      location: [0.0, 0.01045, 0.0]
      variables:
        - temperature

    - name: Side_Far
      location: [0.0, 0.01282, 0.0]
      variables:
        - temperature


    # ------------------------------------------------
    # LONGITUDINAL HEAT CONDUCTION
    # ------------------------------------------------

    - name: Length_Near
      location: [0.020, 0.0, 0.01285]
      variables:
        - temperature

    - name: Length_Mid
      location: [0.050, 0.0, 0.01285]
      variables:
        - temperature

    - name: Length_Far
      location: [0.100, 0.0, 0.01285]
      variables:
        - temperature
