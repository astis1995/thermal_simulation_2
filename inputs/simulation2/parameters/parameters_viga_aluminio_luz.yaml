# ----------------------------------------------------
# Simulacion viga aluminio
# ----------------------------------------------------
domain:
  path: stl/barra_aluminio.stl #
  unit: mm

  mesh:
    output_dir: mesh

    # Element size (mm)
    lc_min: 0.5
    lc_max: 1.0

  material:
    # aluminum
    #alpha: 0.122 mm2/s https://en.wikipedia.org/wiki/Polytetrafluoroethylene
    k: 237          # https://en.wikipedia.org/wiki/List_of_thermal_conductivities
    rho: 2699.0    # kg/m³https://en.wikipedia.org/wiki/Aluminium
    c: 900.0          # https://webbook.nist.gov/cgi/cbook.cgi?ID=C7429905&Type=JANAFS&Table=on

simulation:

  geometry:
    representation: volume

  time:
    dt: 0.2          # s
    T: 75.0           # s

  # ----------------------------------------------------
  # Initial condition
  # ----------------------------------------------------

  initial_condition:
    type: uniform
    ambient: 298.15   # K

  # ----------------------------------------------------
  # Physics
  # ----------------------------------------------------

  physics:

    # ----------------------------------------------
    # Volumetric heat source
    # ----------------------------------------------
    source:
      # Laser can use power
      # Lamps use irradiance
      #
      name: Sun
      enabled: false

      type: lamp

      source: [0.0, 0.0, +inf] #

      direction: [0.0, 0.0, -1.0]
      # Total source power (future implementation)
      power: 250.10        # W/m2 Sun: 832.715 W/m2 Lampara a 40,38 mm 250,1031533 W/m2
      irradiance: 250.10  #
      value: 2.5e12

      # Gaussian center (meters)
      center:
        [0.0, 0.0, 0.005]

      # Gaussian radius
      radius: 0.002    # m

      # Source active between these times
      t_start: 0.0      # s
      t_end: 600.0       # s

    # ----------------------------------------------
    # Convection
    # ----------------------------------------------
    convection:
      enabled: true
      h: 10.0           # W/(m²·K)
      ambient: 298.15   # K

    # ----------------------------------------------
    # Radiation
    # ----------------------------------------------
    radiation:
      enabled: true
      emissivity: 0.01 #UV-VIS
      ambient: 298.15   # K

roi:
  search:
    mode: nearest
    tolerance: 0.0003

  points:

    # ------------------------------------------------
    # TOP SURFACE — DIRECTLY IRRADIATED
    # ------------------------------------------------

    - name: Top_Center
      location: [0.0, 0.0, 0.01285]
      variables:
        - temperature

    - name: Top_NearCenter_Y
      location: [0.0, 0.005, 0.01285]
      variables:
        - temperature

    - name: Top_NearCenter_X
      location: [0.020, 0.0, 0.01285]
      variables:
        - temperature


    # ------------------------------------------------
    # THROUGH-THICKNESS
    # ------------------------------------------------

    - name: Center_Midplane
      location: [0.0, 0.0, 0.0]
      variables:
        - temperature

    - name: Bottom_Center
      location: [0.0, 0.0, -0.01285]
      variables:
        - temperature


    # ------------------------------------------------
    # LATERAL HEAT CONDUCTION
    # ------------------------------------------------

    - name: Side_Near
      location: [0.0, 0.01045, 0.0]
      variables:
        - temperature

    - name: Side_Far
      location: [0.0, 0.01282, 0.0]
      variables:
        - temperature


    # ------------------------------------------------
    # LONGITUDINAL HEAT CONDUCTION
    # ------------------------------------------------

    - name: Length_Near
      location: [0.020, 0.0, 0.01285]
      variables:
        - temperature

    - name: Length_Mid
      location: [0.050, 0.0, 0.01285]
      variables:
        - temperature

    - name: Length_Far
      location: [0.100, 0.0, 0.01285]
      variables:
        - temperature
