# ----------------------------------------------------
# Simulacion con datos de absorbancia
# Material nylon
# Iluminacion superior ubicacion en +z inf, direccion -z
# Iluminacion izquierda ubicacion en -y inf, direccion +y}
# Luz iluminando el centro
# ----------------------------------------------------
domain:
  path: stl/tira_nylon_mm.stl #centro del elitro coor: () parte baja ()
  unit: mm

  mesh:
    output_dir: mesh

    # Element size (mm)
    lc_min: 0.1
    lc_max: 0.5

  material:
    # Nylon (20 °C)
    k: 0.25         # W/(m·K) https://en.wikipedia.org/wiki/Nylon
    rho: 1150.0    # kg/m³ https://en.wikipedia.org/wiki/Nylon
    c: 1700.0          #  J/(kg·K) https://store.gierregomma.com/shop/nylon-6-sheet/?attachment_id=2981&download_file=9l4b29yss73lh

simulation:

  geometry:
    representation: volume

  time:
    dt: 0.2          # s
    T: 60.0           # s

  # ----------------------------------------------------
  # Initial condition
  # ----------------------------------------------------

  initial_condition:
    type: uniform
    ambient: 298.15   # K

  # ----------------------------------------------------
  # Physics
  # ----------------------------------------------------

  physics:

    # ----------------------------------------------
    # Heat sources:
    # lamp: One direction over the complete surface
    # gaussian: a spot
    # ----------------------------------------------
    source:
      name: Sun
      enabled: true

      type: gaussian

      source: [0.0, 0.0, +inf] #Not enabled in gaussian

      direction: [0.0, 0.0, -1.0]
      # Total source power (future implementation)
      power: 250.10        # W Not enabled in gaussian
      irradiance: 1000.0   # W/m2
      value: 2.5e12 #Not enabled in gaussian

      # Gaussian center (meters)
      center:
        [0.0, 0.0, 0.0]

      # Gaussian radius
      radius: 0.040    # m

      # Source active between these times
      t_start: 5.0      # s
      t_end: 50.0       # s

      #absorption_coefficient
      absorption_coefficient: 100.0
    # ----------------------------------------------
    # Convection
    # ----------------------------------------------
    convection:
      enabled: true
      h: 10.0           # W/(m²·K)
      ambient: 298.15   # K

    # ----------------------------------------------
    # Radiation. emissivity must be in the range 8 um to 12 um, 833 cm-1 -1250 cm-1,
    # ----------------------------------------------
    radiation:
      enabled: true
      emissivity: 0.88 #https://journals.sagepub.com/doi/abs/10.1177/0040517519888825
      ambient: 298.15   # K

roi:
  search:
    mode: nearest
    tolerance: 5e-4
  points:

    # Near -X end, top surface
    - name: Left
      location: [-0.400, 0.0, 0.00125]
      variables:
        - temperature

    # Near +X end, top surface
    - name: Right
      location: [0.400, 0.0, 0.00125]
      variables:
        - temperature

    # Center, top surface
    - name: Center
      location: [0.0, 0.0, 0.00125]
      variables:
        - temperature

    # Center, bottom surface
    - name: Bottom
      location: [0.0, 0.0, -0.00125]
      variables:
        - temperature
