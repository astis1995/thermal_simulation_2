# ----------------------------------------------------
# Simulacion con datos de absorbancia
# Material nylon
# Iluminacion superior ubicacion en +z inf, direccion -z
# Iluminacion izquierda ubicacion en -y inf, direccion +y}
# Luz iluminando el centro
# ----------------------------------------------------
domain:
  path: stl/tira_nylon_mm.stl #centro del elitro coor: () parte baja ()
  unit: mm

  mesh:
    output_dir: mesh

    # Element size (mm)
    lc_min: 0.2
    lc_max: 0.5

  material:
    # Nylon (20 °C)
    k: 0.25         # W/(m·K) https://en.wikipedia.org/wiki/Nylon
    rho: 1150    # kg/m³ https://en.wikipedia.org/wiki/Nylon
    c: 1700          #  J/(kg·K) https://store.gierregomma.com/shop/nylon-6-sheet/?attachment_id=2981&download_file=9l4b29yss73lh

simulation:

  geometry:
    representation: volume

  time:
    dt: 0.2          # s
    T: 600.0           # s

  # ----------------------------------------------------
  # Initial condition
  # ----------------------------------------------------

  initial_condition:
    type: uniform
    ambient: 298.15   # K

  # ----------------------------------------------------
  # Physics
  # ----------------------------------------------------

  physics:

    # ----------------------------------------------
    # Volumetric heat source
    # ----------------------------------------------
    source:
      name: Sun
      enabled: true

      type: lamp

      source: [0.0, +inf, 0.0] #

      direction: [0.0, -1.0, 0.0]
      # Total source power (future implementation)
      power: 250.10        # W/m2 Sun: 832.715 W/m2 Lampara a 40,38 mm 250,1031533 W/m2

      value: 2.5e12

      # Gaussian center (meters)
      center:
        [0.0, 0.0, 0.005]

      # Gaussian radius
      radius: 0.002    # m

      # Source active between these times
      t_start: 0.0      # s
      t_end: 600.0       # s

    # ----------------------------------------------
    # Convection
    # ----------------------------------------------
    convection:
      enabled: true
      h: 10.0           # W/(m²·K)
      ambient: 298.15   # K

    # ----------------------------------------------
    # Radiation. emissivity must be in the range 8 um to 12 um, 833 cm-1 -1250 cm-1,
    # ----------------------------------------------
    radiation:
      enabled: true
      emissivity: 0.88 #https://journals.sagepub.com/doi/abs/10.1177/0040517519888825
      ambient: 298.15   # K

roi:
  search:
    mode: nearest
    tolerance: 5e-4
  points:

    - name: Left
      location: [-0.002470473, -0.004185681, -0.006781751]
      variables:
        - temperature

    - name: Right
      location: [-0.001115140, 0.005589383, -0.005121521]
      variables:
        - temperature

    - name: Center
      location: [-0.001820740, 0.000601505, -0.006505752]
      variables:
        - temperature

    - name: Cabeza
      location: [-0.003014972, 0.001827026, 0.002142696]
      variables:
        - temperature
