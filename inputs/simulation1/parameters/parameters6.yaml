domain:
  path: stl/prism_10_10_3.stl
  unit: mm

  mesh:
    output_dir: mesh

    # Element size (mm)
    lc_min: 0.2
    lc_max: 0.5

  material:
    # Copper (20 °C)
    k: 401.0          # W/(m·K)
    rho: 8960.0       # kg/m³
    c: 385.0          # J/(kg·K)

simulation:
  geometry:
    representation: volume

  time:
    dt: 0.01
    T: 10.0

  initial_condition:
    type: hotspot

    ambient: 298.15     # K
    delta: 40.0         # Initial hotspot temperature increase

    # Center of a 10×10×3 mm prism (converted to meters)
    center:
      [0.005, 0.005, 0.0015]

    # 0.5 mm radius
    radius: 0.0005
