domain:
  path: stl/cube_10x10x10.stl
  unit: mm
  mesh:
    output_dir: mesh

    # 0.2–0.5 mm elements
    lc_min: 0.2
    lc_max: 0.5

  material:
    # Approximate chitin properties (SI units)
    k: 0.3          # W/(m·K)
    rho: 1420.0     # kg/m³
    c: 1300.0       # J/(kg·K)

simulation:
  geometry:
    representation: volume

  time:
    dt: 0.01
    T: 20.0

  initial_condition:
    type: hotspot

    ambient: 298.15     # K
    delta: 40.0        # K

    # X MAX point from STL analysis
    center:
      [0.005, 0.005, 0.005]

    # Previous hotspot radius (700 μm)
    radius: 0.001
