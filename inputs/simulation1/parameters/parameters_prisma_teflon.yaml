# ----------------------------------------------------
# Simulacion bloque de teflón
# ----------------------------------------------------
domain:
  path: stl/bloque_teflon_mm.stl #centro del elitro coor: () parte baja ()
  unit: mm

  mesh:
    output_dir: mesh

    # Element size (mm)
    lc_min: 0.2
    lc_max: 0.5

  material:
    # Teflon
    #alpha: 0.122 mm2/s https://en.wikipedia.org/wiki/Polytetrafluoroethylene
    k: 0.25          # https://en.wikipedia.org/wiki/Polytetrafluoroethylene
    rho: 2200.0    # kg/m³ https://en.wikipedia.org/wiki/Polytetrafluoroethylene
    c: 931.0          # 193 J/(kg·K) deducido a partir de alpha rho y k

simulation:

  geometry:
    representation: volume

  time:
    dt: 0.1          # s
    T: 10.0           # s

  # ----------------------------------------------------
  # Initial condition
  # ----------------------------------------------------

  initial_condition:
    type: uniform
    ambient: 298.15   # K

  # ----------------------------------------------------
  # Physics
  # ----------------------------------------------------

  physics:

    # ----------------------------------------------
    # Volumetric heat source
    # ----------------------------------------------
    source:
      name: Sun
      enabled: true

      type: lamp

      source: [0.0, 0.0, +inf] #

      direction: [0.0, 0.0, -1.0]
      # Total source power (future implementation)
      power: 250.10        # W/m2 Sun: 832.715 W/m2 Lampara a 40,38 mm 250,1031533 W/m2

      value: 2.5e12

      # Gaussian center (meters)
      center:
        [0.0, 0.0, 0.005]

      # Gaussian radius
      radius: 0.002    # m

      # Source active between these times
      t_start: 0.0      # s
      t_end: 600.0       # s

    # ----------------------------------------------
    # Convection
    # ----------------------------------------------
    convection:
      enabled: true
      h: 10.0           # W/(m²·K)
      ambient: 298.15   # K

    # ----------------------------------------------
    # Radiation
    # ----------------------------------------------
    radiation:
      enabled: true
      emissivity: 0.01 #UV-VIS
      ambient: 298.15   # K

roi:
  search:
    mode: nearest
    tolerance: 5e-4
  points:

    - name: Left
      location: [-0.002470473, -0.004185681, -0.006781751]
      variables:
        - temperature

    - name: Right
      location: [-0.001115140, 0.005589383, -0.005121521]
      variables:
        - temperature

    - name: Center
      location: [-0.001820740, 0.000601505, -0.006505752]
      variables:
        - temperature

    - name: Cabeza
      location: [-0.003014972, 0.001827026, 0.002142696]
      variables:
        - temperature
