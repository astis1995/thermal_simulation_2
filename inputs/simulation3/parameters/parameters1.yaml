surface:
  path: stl/surface.stl

  mesh:
    lc_min: 0.005
    lc_max: 0.02

  material:
    # Approximate chitin properties
    k: 0.3        # W/(m·K)
    rho: 1420.0   # kg/m³
    c: 1300.0     # J/(kg·K)

simulation:
  time:
    dt: 0.01
    T: 1.0

  initial_condition:
    type: hotspot
    ambient: 298.15   # K (room temp)
    delta: 50.0       # temperature increase (K)
    center: [0.0, 0.0, 0.0]
    radius: 0.02
